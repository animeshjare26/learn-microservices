spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderDB
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /api/orders
  port: 9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management :
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  retry:
    configs:
      default:
        maxRetryAttempts: 3
        waitDuration: 100ms

    instances:
      inventoryRetry:
        baseConfig: default
        waitDuration: 200ms

  ratelimiter:
    instances:
      inventoryRateLimiter:
        limitRefreshPeriod: 2s
        limitForPeriod: 1
        timeoutDuration: 1s

  circuitbreaker:
    instances:
      inventoryCircuitBreaker:
        registerHealthIndicator: true # expose circuit breaker health via actuator
        slidingWindowSize: 10 # size of the sliding window
        slidingWindowType: COUNT_BASED # use count-based sliding window
        minimumNumberOfCalls: 10 #minimum no. of calls before calculating failure rate
        failureRateThreshold: 50 # if 50% calls fails, circuit goes to OPEN state
        waitDurationInOpenState: 20s #Time the circuit stays OPEN before moving onto HALF_OPEN state
        permittedNumberOfCallsInHalfOpenState: 3 #Number of test calls in HALF_OPEN state
        eventConsumerBufferSize: 10 # Buffer size for event logs


